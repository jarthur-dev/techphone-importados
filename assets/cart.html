    <!-- CARRINHO (PAINEL LATERAL) -->
    <div id="cart-overlay" class="hidden fixed inset-0 z-[65] bg-black/60 backdrop-blur-sm" onclick="closeCart()"></div>

    <aside id="cart-panel" aria-hidden="true" aria-label="Carrinho de compras"
        class="fixed top-0 right-0 w-full max-w-md h-full bg-slate-900 text-white shadow-2xl z-[70] flex flex-col border-l border-slate-800 translate-x-full invisible transition-all duration-300">

        <div class="flex items-center justify-between p-5 border-b border-slate-800">
            <h2 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-cart-shopping text-brand-orange"></i>
                Seu carrinho
            </h2>
            <button onclick="closeCart()" aria-label="Fechar carrinho"
                class="w-9 h-9 rounded-full bg-slate-800 hover:bg-brand-orange text-white flex items-center justify-center transition-colors">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-5">
            <p id="cart-empty" class="text-slate-400 text-center py-12">
                <i class="fa-solid fa-cart-shopping text-4xl mb-3 block text-slate-600"></i>
                Seu carrinho está vazio.
            </p>
            <div id="cart-items" class="space-y-3"></div>
        </div>

        <div id="cart-footer" class="hidden p-5 border-t border-slate-800 space-y-3">
            <div class="flex items-center justify-between">
                <span class="text-sm text-slate-400 uppercase font-semibold">Total</span>
                <span id="cart-total" class="text-2xl font-black text-brand-orange">R$ 0,00</span>
            </div>
            <button onclick="checkoutWhatsApp()"
                class="w-full inline-flex items-center justify-center gap-2 bg-brand-whatsapp hover:bg-brand-whatsappHover text-white px-4 py-3.5 rounded-xl font-bold text-sm transition-all active:scale-95 cursor-pointer">
                <i class="fa-brands fa-whatsapp text-lg"></i>
                <span>Finalizar pedido no WhatsApp</span>
            </button>
            <button onclick="clearCart()"
                class="w-full text-xs text-slate-500 hover:text-red-400 transition-colors cursor-pointer">
                Limpar carrinho
            </button>
        </div>
    </aside>
